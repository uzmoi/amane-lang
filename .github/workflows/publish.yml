name: Publish

on:
  push:
    tags: [v*.*.*]


jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/setup@v3.2.0

      - run: pnpm build

      - run: pnpm publish --no-git-check
